name: tests
on:
  push:
  pull_request:
    branches-ignore:
      - i18n_master

permissions:
  contents: read

env:
  TEST_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 1 || '' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:14.19
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_USER: consul
          POSTGRES_PASSWORD: password
    env:
      PGUSER: consul
      PGPASSWORD: password
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Setup NPM
        uses: actions/setup-node@v7
        with:
          cache: "npm"
          node-version-file: ".node-version"
      - name: Install node packages
        run: npm clean-install
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install imagemagick
      - name: Copy secrets and database files
        run: for i in config/*.example; do cp "$i" "${i/.example}"; done
      - name: Setup database
        run: bundle exec rake db:setup
      - name: Compile assets
        run: bundle exec rake assets:precompile > /dev/null 2>&1
      - name: Run test suite
        run: bin/rspec-queue --tag ~consul
      - name: Coveralls
        if: ${{ env.TEST_COVERAGE == 1 }}
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tmp/capybara/
